<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alix Labonne - Designer Graphique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Crosshair overlay: stays above background but behind main UI -->
    <div id="crosshair" aria-hidden="true">
        <div class="crosshair-line horizontal"></div>
        <div class="crosshair-line vertical"></div>
    </div>
    <header>
        <div class="header-content">
            <a href="./index.html" class="logo-section">
                <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
                    <polygon style="fill: currentColor;" points="378.62 460.84 138.83 945 460.79 559.65 378.62 460.84"/>
                    <polygon style="fill: currentColor;" points="941.17 945 701.38 460.84 619.21 559.65 941.17 945"/>
                    <polygon style="fill: currentColor;" points="540 135 437.01 342.94 472.78 385.65 510.42 430.44 540 465.64 569.58 430.44 607.08 385.82 642.99 342.94 540 135"/>
                </svg>
                <div class="logo-text">Alix Labonne</div>
            </a>
            <div class="nav-section">
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="scrollToSection('portfolio')">Portfolio</button>
                    <button class="nav-btn" onclick="scrollToSection('contact')">Contact</button>
                </div>
                <div class="lang-toggle">
                    <button class="lang-btn" id="lang-en" onclick="navigateLang('en')">EN</button>
                    <button class="lang-btn active" id="lang-fr" onclick="navigateLang('fr')">FR</button>
                    <div class="lang-slider"></div>
                </div>
            </div>
        </div>
    </header>

    <nav class="section-nav section-nav-hero" id="section-nav-hero">
        <button class="section-nav-btn">01 / Hero</button>
    </nav>

    <nav class="section-nav section-nav-portfolio" id="section-nav-portfolio">
        <button class="section-nav-btn">02 / Portfolio</button>
    </nav>

    <nav class="section-nav section-nav-contact" id="section-nav-contact">
        <button class="section-nav-btn">03 / Contact</button>
    </nav>

    <!-- carousel-nav moved into the hero section so it stays next to the carousel image -->

    <section class="hero" id="hero">
        <div class="hero-pattern"></div>
        <div class="hero-inner">
            <div class="hero-title" id="hero-title">Alix –<br>Designer<br>Graphique</div>
            <div class="hero-media">
            <div class="hero-image-container">
                <img class="hero-image fade-in" id="hero-image" src="https://images.unsplash.com/photo-1561070791-2526d30994b5?w=500&h=500&fit=crop" alt="Portfolio">
                <!-- Overlay that mirrors project-card layout: year (top), title (center), category (bottom) -->
                <div class="hero-slide-content" aria-hidden="true">
                    <div class="hero-slide-year"></div>
                    <div class="hero-slide-title"></div>
                    <div class="hero-slide-category"></div>
                </div>
            </div>

            <div class="carousel-nav" aria-label="Carousel navigation">
            <!-- Up arrow -->
            <button class="carousel-arrow up" id="carousel-prev" type="button" aria-label="Previous slide">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <path d="M16 10L16 22M16 22L11 17M16 22L21 17" stroke="var(--off-white)" stroke-width="2"/>
                </svg>
            </button>

            <!-- Slide buttons (one per hero slide) — placed as direct children for equal spacing -->
            <button class="carousel-dot active" data-slide="0" type="button" role="tab" aria-selected="true" aria-label="Slide 1"></button>
            <button class="carousel-dot" data-slide="1" type="button" role="tab" aria-selected="false" aria-label="Slide 2"></button>
            <button class="carousel-dot" data-slide="2" type="button" role="tab" aria-selected="false" aria-label="Slide 3"></button>

            <!-- Down arrow -->
            <button class="carousel-arrow down" id="carousel-next" type="button" aria-label="Next slide">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <path d="M16 10L16 22M16 22L11 17M16 22L21 17" stroke="var(--off-white)" stroke-width="2"/>
                </svg>
            </button>
    </div>
    </div> <!-- /.hero-media -->
    </div> <!-- /.hero-inner -->
    <div class="hero-banner">
            <svg class="scroll-down" viewBox="0 0 32 32" fill="none" onclick="scrollToSection('portfolio')">
                <circle cx="16" cy="16" r="15" stroke-width="2"/>
                <path d="M16 10L16 22M16 22L11 17M16 22L21 17" stroke="var(--off-white)" stroke-width="2"/>
            </svg>
        </div>
    </section>

    <section class="portfolio" id="portfolio">
        <nav class="section-nav" id="section-nav-portfolio">
            <button class="section-nav-btn" onclick="scrollToSection('portfolio')">02 / Portfolio</button>
        </nav>
        <div class="filter-container">
            <button class="filter-btn active" data-filter="Tous">Tous</button>
            <button class="filter-btn" data-filter="Brand design">Brand design</button>
            <button class="filter-btn" data-filter="Motion design">Motion design</button>
            <button class="filter-btn" data-filter="Interfaces">Interfaces</button>
            <button class="filter-btn" data-filter="Prints">Prints</button>
        </div>
        <div class="project-grid" id="project-grid"></div>
    </section>

    <section class="contact" id="contact">
        <nav class="section-nav" id="section-nav-contact">
            <button class="section-nav-btn" onclick="scrollToSection('contact')">03 / Contact</button>
        </nav>
        <div class="contact-pattern"></div>
        <div class="contact-banner"></div>
        <div class="contact-content">
            <!-- Contact heading removed to match other sections -->
            <div class="contact-grid">
                <div>
                    <div class="contact-section">
                        <div class="contact-label">Email</div>
                        <a href="mailto:alix.labonne@pm.me" class="contact-link">alix.labonne@pm.me</a>
                    </div>
                    <div class="contact-section">
                        <div class="contact-label">Téléphone</div>
                        <a href="tel:+33782762238" class="contact-link">+33 7 82 76 22 38</a>
                    </div>
                    <div class="contact-section">
                        <a class="cv-btn" href="Alix_Labonne_CV.pdf" download aria-label="Télécharger mon CV">
                            <!-- download icon (tray + down arrow) -->
                            <svg class="cv-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 3v10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M8 11l4 4 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <rect x="3" y="17" width="18" height="3" rx="1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span>Télécharger mon CV</span>
                        </a>
                    </div>
                </div>
                <div>
                    <!--<div class="contact-section">
                        <div class="contact-label">Disponibilité</div>
                        <div class="contact-text">Actuellement disponible pour des projets freelance et collaborations créatives.</div>
                    </div>-->
                    <div class="contact-section">
                        <div class="contact-label">Localisation</div>
                        <div class="contact-text">Paris, France</div>
                    </div>
                    <div class="contact-label">Réseaux sociaux</div>
                        <div class="social-icons">
                            <a class="social-btn" href="https://www.linkedin.com/in/alix-labonne-%F0%9F%94%B7-937246194/" target="_blank" rel="noopener" aria-label="LinkedIn">
                                <svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
                            </a>
                            <a class="social-btn" href="https://www.instagram.com/labonne.alix/" target="_blank" rel="noopener" aria-label="Instagram">
                                <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
                            </a>
                        </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
